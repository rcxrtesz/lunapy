<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LunaPy · Aprende Python pensando</title>
  <meta name="description" content="Aplicación para aprender Python desde cero desarrollando pensamiento computacional." />

  <!-- Aplicación instalable (PWA) -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#4a57f0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0d18" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192" />
  <!-- iPhone / iPad: «Añadir a pantalla de inicio» -->
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="LunaPy" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Todo se sirve desde la propia app (vendor/): funciona sin conexión -->
  <link rel="stylesheet" href="./vendor/codemirror/codemirror.min.css" />
  <link rel="stylesheet" href="./src/styles.css" />
  <script>
    // Aplica el tema antes de pintar para evitar parpadeos.
    try {
      const s = JSON.parse((localStorage.getItem('lunapy.v1') || localStorage.getItem('pyensa.v1')) || '{}');
      const t = s.theme && s.theme !== 'system' ? s.theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.palette = s.palette || 'indigo';
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
</head>
<body>
  <div id="app">
    <div class="boot">Cargando LunaPy…</div>
  </div>
  <noscript>LunaPy necesita JavaScript para funcionar.</noscript>
  <script src="./vendor/codemirror/codemirror.min.js"></script>
  <script src="./vendor/codemirror/python.min.js"></script>
  <script src="./vendor/codemirror/matchbrackets.min.js"></script>
  <script src="./vendor/codemirror/closebrackets.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
