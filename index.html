<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LunaPy · Aprende Python pensando</title>
  <meta name="description" content="Plataforma interactiva para aprender Python desde cero desarrollando pensamiento computacional." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f5dff'/%3E%3Cpath d='M18.5 6.5A10 10 0 1 0 25.5 22 8 8 0 0 1 18.5 6.5z' fill='white'/%3E%3Ccircle cx='23.5' cy='9.5' r='2.4' fill='%23f2a516'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="./src/styles.css" />
  <script>
    // Aplica el tema antes de pintar para evitar parpadeos.
    try {
      const s = JSON.parse((localStorage.getItem('lunapy.v1') || localStorage.getItem('pyensa.v1')) || '{}');
      const t = s.theme && s.theme !== 'system' ? s.theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.palette = s.palette || 'indigo';
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
</head>
<body>
  <div id="app">
    <div class="boot">Cargando LunaPy…</div>
  </div>
  <noscript>LunaPy necesita JavaScript para funcionar.</noscript>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
