<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LunaPy · Tests de ejercicios</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #f5f6fa; color: #141a2e; }
    h1 { margin: 0 0 6px; }
    #summary { font-weight: 700; margin: 12px 0 18px; font-size: 1.1rem; }
    .t { font-family: ui-monospace, Consolas, monospace; font-size: 13px; padding: 4px 8px; border-radius: 6px; margin: 2px 0; }
    .ok { background: #e3f7ee; } .bad { background: #fdecec; }
  </style>
</head>
<body>
  <h1>Tests de ejercicios (Python real en Pyodide)</h1>
  <div>Comprueba que cada validador acepta soluciones correctas distintas, rechaza las erróneas con la categoría adecuada y que las respuestas de las preguntas coinciden con lo que hace Python.</div>
  <div id="summary">Cargando Python…</div>
  <div id="out"></div>
  <script type="module">
    import { engine } from './src/engine/python.js';
    import { ACTIVITIES } from './src/content/activities.js';
    import { REVIEW_ITEMS } from './src/content/review.js';
    import { LESSONS } from './src/content/lessons.js';

    const out = document.getElementById('out');
    const results = [];
    const log = (ok, name, detail = '') => {
      results.push(ok);
      const d = document.createElement('div');
      d.className = `t ${ok ? 'ok' : 'bad'}`;
      d.textContent = `${ok ? '✓' : '✗'} ${name}${detail ? ' — ' + detail : ''}`;
      out.appendChild(d);
    };
    const text = (segs) => segs.map(([, s]) => s).join('').replace(/\s+$/, '');

    // ---------- Fusión del progreso entre dispositivos (src/state/merge.js) ----------
    {
      const { merge } = await import('./src/state/merge.js');
      const base = { version: 1, createdAt: 100, updatedAt: 200, xp: 50, daily: { d1: { xp: 50, activities: 2 } },
        activities: { a: { attempts: 2, fails: 1, completed: false } }, concepts: { c: { attempts: 3, good: 2, wrong: 1, box: 2, history: [1, 1], errors: { E: 1 } } },
        lessons: { l1: { maxStep: 3, completed: false, lastAt: 200 } }, checks: { q1: { correct: true, at: 150 } }, errors: { logica: 1 },
        achievements: { first: 150 }, log: [{ t: 150, kind: 'xp', label: 'A' }], drafts: {}, plans: {}, profile: { name: 'Ana' }, theme: 'light', palette: 'indigo', dayOffset: 0, lab: null };
      const clone = (o) => JSON.parse(JSON.stringify(o));
      // Móvil (local) y ordenador (remoto) parten de la misma base y avanzan sin conexión.
      const local = clone(base);
      local.updatedAt = 300; local.xp = 70; local.daily.d1.xp = 70; local.activities.a.attempts = 3; local.activities.a.completed = true; local.activities.a.completedAt = 290;
      local.lessons.l1.maxStep = 5; local.lessons.l1.lastAt = 300; local.checks.q2 = { correct: false, at: 280 }; local.log.unshift({ t: 290, kind: 'xp', label: 'B' });
      local.profile = { name: 'Ana móvil' }; local.drafts.x = 'print(1)';
      const remote = clone(base);
      remote.updatedAt = 250; remote.xp = 65; remote.daily.d1.xp = 65; remote.activities.a.attempts = 4; remote.lessons.l2 = { maxStep: 1, completed: true, completedAt: 240 };
      remote.concepts.c.attempts = 5; remote.concepts.c.box = 3; remote.achievements.second = 240; remote.log.unshift({ t: 240, kind: 'xp', label: 'C' });
      remote.drafts.x = 'print(2)'; remote.drafts.y = 'print(3)'; remote.theme = 'dark';
      const m = merge(local, remote, base);
      log(m.xp === 85, 'fusión · la XP ganada en los dos dispositivos se suma', `xp=${m.xp}`);
      log(m.daily.d1.xp === 85 && m.daily.d1.activities === 2, 'fusión · los contadores diarios se suman', JSON.stringify(m.daily.d1));
      log(m.activities.a.attempts === 5 && m.activities.a.completed && m.activities.a.completedAt === 290, 'fusión · intentos sumados y actividad completada', JSON.stringify(m.activities.a));
      log(m.lessons.l1.maxStep === 5 && m.lessons.l2.completed, 'fusión · se conservan las lecciones de los dos', JSON.stringify(m.lessons));
      log(m.checks.q1 && m.checks.q2 && m.achievements.first && m.achievements.second, 'fusión · preguntas y logros se unen');
      log(m.concepts.c.box === 3 && m.concepts.c.attempts === 5, 'fusión · el concepto toma la caja del lado con más práctica', JSON.stringify(m.concepts.c));
      log(m.log.map((e) => e.label).join() === 'B,C,A', 'fusión · historial unido, sin duplicados y ordenado', m.log.map((e) => e.label).join());
      log(m.profile.name === 'Ana móvil' && m.theme === 'light' && m.drafts.x === 'print(1)' && m.drafts.y === 'print(3)', 'fusión · ajustes y borradores del dispositivo más reciente', `${m.profile.name} ${m.theme} ${JSON.stringify(m.drafts)}`);
      const first = merge({ ...clone(base), xp: 10, updatedAt: 0, profile: { name: '' } }, clone(base), null);
      log(first.xp === 50 && first.profile.name === 'Ana', 'fusión · primera sincronización de un dispositivo nuevo: toma el mayor', `xp=${first.xp}`);
      log(merge(local, null, base) === local, 'fusión · sin datos en el servidor se queda el local');
    }

    async function expectOutput(name, code, expected, expectError) {
      const r = await engine.run(code, []);
      if (expectError) return log(r.status === 'error' && r.error.type === expectError, name, `error=${r.error && r.error.type}`);
      const got = text(r.segs);
      log(r.status === 'ok' && got === expected, name, `salida=${JSON.stringify(got)} esperada=${JSON.stringify(expected)}`);
    }

    for (const a of Object.values(ACTIVITIES)) {
      if (a.type === 'code') {
        for (const [i, ref] of (a.reference || []).entries()) {
          const r = await engine.check(ref, a.spec);
          log(r.status === 'pass', `${a.id} · solución correcta #${i + 1} aceptada`, `${r.category}: ${r.title}`);
        }
        const sol = await engine.check(a.solution.code, a.spec);
        log(sol.status === 'pass', `${a.id} · solución explicada aceptada`, sol.category);
        for (const [i, w] of (a.wrongs || []).entries()) {
          const r = await engine.check(w.code, a.spec);
          log(r.status === 'fail' && r.category === w.category, `${a.id} · solución errónea #${i + 1} rechazada como «${w.category}»`, `obtenido: ${r.status}/${r.category}`);
        }
      }
      if (a.type === 'predict') await expectOutput(`${a.id} · la salida declarada coincide con Python`, a.code, a.expectedOutput);
      if (a.type === 'order') {
        for (const st of a.stages.filter((x) => x.code)) {
          const code = st.items.map((i) => i.text).join('\n');
          const r = await engine.run(code, ['100', '20']);
          log(r.status === 'ok' && text(r.segs).endsWith('Precio final: 80.0'), `${a.id} · el código ordenado funciona`, text(r.segs));
        }
      }
    }

    for (const it of REVIEW_ITEMS.filter((i) => i.code)) {
      await expectOutput(`repaso ${it.id}`, it.code, it.answer, it.expectError);
    }

    for (const lesson of Object.values(LESSONS)) {
      for (const st of lesson.steps) {
        for (const b of st.blocks || []) {
          if (b.type !== 'check' || !b.code) continue;
          const expected = b.mode === 'text' ? b.answer : b.expectOutput;
          await expectOutput(`lección ${lesson.code} · ${b.id}`, b.code, expected, b.expectError);
        }
      }
      // Cada paso que referencia una actividad debe existir
      for (const st of lesson.steps.filter((x) => x.activity)) {
        log(!!ACTIVITIES[st.activity], `lección ${lesson.code} · la actividad ${st.activity} existe`);
      }
    }

    // Límite de tiempo: un bucle infinito debe detenerse y el motor recuperarse
    const t0 = performance.now();
    const loop = await engine.run('while True:\n    pass', []);
    log(loop.error && loop.error.type === 'Timeout', 'bucle infinito detenido por límite de tiempo', `${Math.round(performance.now() - t0)} ms`);
    const after = await engine.run('print(1 + 1)', []);
    log(text(after.segs) === '2', 'el motor se recupera tras el límite de tiempo');

    const passed = results.filter(Boolean).length;
    document.getElementById('summary').textContent = `${passed}/${results.length} tests superados`;
    document.title = `${passed}/${results.length} · Tests LunaPy`;
    window.__testResult = { passed, total: results.length };
  </script>
</body>
</html>
