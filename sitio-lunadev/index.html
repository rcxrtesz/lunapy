<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>lunadev · En construcción</title>
  <meta name="description" content="lunadev: la web está en construcción. Mientras tanto, aprende Python con LunaPy." />
  <meta name="theme-color" content="#2b2433" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/en-construccion/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/en-construccion/favicon.png" type="image/png" sizes="64x64" />
  <!--
    Página temporal de lunadev.es. WordPress sigue instalado debajo, sin cambios:
    este index.html tiene prioridad sobre el index.php de WordPress solo en la portada.
    Para volver a mostrar WordPress, basta con borrar este archivo (y la carpeta en-construccion/).
  -->
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-display: swap; font-weight: 100 900;
      src: url('/en-construccion/inter-latin.woff2') format('woff2'); }

    :root {
      --lila: #c39cf2; --lila-claro: #efe4fb; --lila-suave: #cdb6ea; --morado: #7a4cc2;
      --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--lila-claro);
      background: radial-gradient(ellipse at 50% 38%, #4b3470 0%, #2b2433 55%, #17121c 100%) fixed, #17121c;
      -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }

    /* Estrellitas, como en la pantalla de carga de LunaPy */
    .cielo { position: fixed; inset: 0; pointer-events: none; opacity: .75; animation: titilar 2.4s ease-in-out infinite alternate;
      background-image:
        radial-gradient(2px 2px at 12% 18%, #fff3b0, transparent), radial-gradient(2px 2px at 82% 14%, #e2cbfb, transparent),
        radial-gradient(1.5px 1.5px at 28% 72%, #fff3b0, transparent), radial-gradient(2px 2px at 88% 66%, #fff3b0, transparent),
        radial-gradient(1.5px 1.5px at 64% 30%, #e2cbfb, transparent), radial-gradient(1.5px 1.5px at 8% 48%, #e2cbfb, transparent),
        radial-gradient(2px 2px at 46% 10%, #fff3b0, transparent), radial-gradient(1.5px 1.5px at 72% 86%, #e2cbfb, transparent),
        radial-gradient(1.5px 1.5px at 20% 92%, #fff3b0, transparent), radial-gradient(2px 2px at 94% 38%, #e2cbfb, transparent); }
    .cielo.b { animation-delay: 1.2s; transform: translate(3%, 5%) scale(1.1); opacity: .5; }
    @keyframes titilar { to { opacity: .3; } }
    .luna { position: fixed; top: calc(7% + var(--sat)); right: 9%; width: 70px; height: 70px; border-radius: 50%;
      box-shadow: -14px 6px 0 0 #e2cbfb; transform: rotate(-20deg); opacity: .85; filter: drop-shadow(0 0 18px rgba(226, 203, 251, .45)); }

    main { position: relative; min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; padding: calc(28px + var(--sat)) 16px calc(28px + var(--sab)); text-align: center; }

    .escena { position: relative; width: min(200px, 46vw, 26vh); }
    .kuromi { display: block; width: 100%; height: auto; filter: drop-shadow(0 14px 18px rgba(0, 0, 0, .45));
      animation: flotar 3s ease-in-out infinite; transform-origin: 50% 100%; }
    @keyframes flotar { 50% { transform: translateY(-8px) rotate(-1.5deg); } }
    .sombra { width: 60%; height: 12px; margin: 4px auto 0; border-radius: 50%; background: rgba(0, 0, 0, .35);
      filter: blur(3px); animation: sombra 3s ease-in-out infinite; }
    @keyframes sombra { 50% { transform: scaleX(.82); opacity: .7; } }
    .cartel { position: absolute; right: -16%; bottom: 22%; padding: 6px 10px; border-radius: 10px; font-size: .78rem; font-weight: 800;
      color: #1d1824; background: repeating-linear-gradient(135deg, #ffd34d 0 10px, #1d1824 10px 20px); box-shadow: 0 6px 14px rgba(0, 0, 0, .35);
      transform: rotate(8deg); animation: balanceo 2.6s ease-in-out infinite; }
    .cartel span { display: block; background: #ffd34d; border-radius: 6px; padding: 3px 8px; }
    @keyframes balanceo { 50% { transform: rotate(3deg) translateY(-3px); } }

    .marca { margin: 18px 0 0; font-size: clamp(2.4rem, 9vw, 3.6rem); font-weight: 850; letter-spacing: -.035em; color: #fff; line-height: 1; }
    .marca b { color: var(--lila); font-weight: 850; }
    .titulo { margin: 10px 0 0; font-size: clamp(1.1rem, 4.2vw, 1.4rem); font-weight: 700; color: var(--lila-claro); }
    .puntos i { font-style: normal; animation: pulso 1s infinite; }
    .puntos i:nth-child(2) { animation-delay: .2s; }
    .puntos i:nth-child(3) { animation-delay: .4s; }
    @keyframes pulso { 50% { opacity: .25; } }
    .texto { max-width: 440px; margin: 10px auto 0; color: var(--lila-suave); line-height: 1.6; font-size: .98rem; }

    /* Carretera, como bajo la moto de la pantalla de carga */
    .carretera { width: min(300px, 70vw); height: 4px; margin: 22px auto 0; border-radius: 4px; opacity: .55;
      background: repeating-linear-gradient(90deg, #b98ce8 0 26px, transparent 26px 44px); background-size: 44px 4px;
      animation: carretera .5s linear infinite; }
    @keyframes carretera { to { background-position: -44px 0; } }

    .tarjeta { margin: 24px auto 0; max-width: 420px; width: 100%; padding: 18px 20px; border-radius: 20px; text-align: left;
      background: rgba(255, 255, 255, .06); border: 1px solid rgba(226, 203, 251, .18); backdrop-filter: blur(6px);
      display: flex; align-items: center; gap: 14px; }
    .tarjeta .icono { flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 1.5rem;
      background: rgba(195, 156, 242, .16); }
    .tarjeta p { margin: 0; font-size: .92rem; color: var(--lila-suave); line-height: 1.45; }
    .tarjeta strong { color: #fff; }
    .boton { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; padding: 13px 24px; border-radius: 14px;
      background: var(--lila); color: #17121c; font-weight: 800; text-decoration: none; font-size: 1rem;
      box-shadow: 0 8px 22px rgba(195, 156, 242, .35); transition: transform .15s ease, box-shadow .15s ease, background .15s ease; }
    .boton:hover { transform: translateY(-2px); background: #d2b3f6; box-shadow: 0 12px 26px rgba(195, 156, 242, .45); }
    .boton:focus-visible { outline: 3px solid #fff3b0; outline-offset: 3px; }
    .boton svg { transition: transform .15s ease; }
    .boton:hover svg { transform: translateX(3px); }

    footer { margin-top: 34px; font-size: .8rem; color: rgba(205, 182, 234, .7); }
    footer a { color: var(--lila-suave); font-weight: 700; text-decoration: none; }

    /* Entrada suave */
    .entra { opacity: 0; animation: entrar .7s cubic-bezier(.2, .7, .2, 1) forwards; }
    .entra.d1 { animation-delay: .1s; } .entra.d2 { animation-delay: .25s; } .entra.d3 { animation-delay: .4s; } .entra.d4 { animation-delay: .55s; }
    @keyframes entrar { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    main { gap: 2px; padding-top: calc(14px + var(--sat)); padding-bottom: calc(14px + var(--sab)); }
    .marca { margin-top: 10px; }
    .titulo { margin-top: 6px; }
    .carretera { margin-top: 16px; }
    .tarjeta { margin-top: 18px; padding: 14px 18px; }
    .boton { margin-top: 14px; }
    footer { margin-top: 22px; }
    @media (max-height: 700px) { .texto { display: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .entra { opacity: 1; } }
  </style>
</head>
<body>
  <div class="cielo" aria-hidden="true"></div>
  <div class="cielo b" aria-hidden="true"></div>
  <div class="luna" aria-hidden="true"></div>

  <main>
    <div class="escena entra">
      <img class="kuromi" src="/en-construccion/kuromi_motera.png" alt="Kuromi con chaqueta motera saludando" width="220" height="316" />
      <div class="sombra" aria-hidden="true"></div>
      <div class="cartel" aria-hidden="true"><span>🚧 En obras</span></div>
    </div>

    <h1 class="marca entra d1">luna<b>dev</b></h1>
    <p class="titulo entra d2">Web en construcción<span class="puntos" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></p>
    <p class="texto entra d2">Estamos preparando algo bonito. Vuelve pronto: la web está calentando motores.</p>
    <div class="carretera entra d3" aria-hidden="true"></div>

    <div class="tarjeta entra d4">
      <div class="icono" aria-hidden="true">🌙</div>
      <p><strong>Mientras tanto, aprende Python con LunaPy</strong><br />Lecciones, retos y una asistente motera que te ayuda paso a paso.</p>
    </div>
    <a class="boton entra d4" href="/lunapy/">Ir a LunaPy
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
    </a>

    <footer class="entra d4">© <span id="anio">2026</span> <a href="/">lunadev</a></footer>
  </main>
  <script>document.getElementById('anio').textContent = new Date().getFullYear();</script>
</body>
</html>
