<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>lunadev · Web en construcción</title>
  <meta name="description" content="lunadev: diseño y desarrollo web. Estamos construyendo nuestra nueva web; vuelve pronto." />
  <meta name="theme-color" content="#f7f3fc" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/en-construccion/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/en-construccion/favicon.png" type="image/png" sizes="64x64" />
  <!--
    Página temporal de lunadev.es. WordPress sigue instalado debajo, sin cambios:
    este index.html tiene prioridad sobre el index.php de WordPress solo en la portada.
    Para volver a mostrar WordPress, basta con borrar este archivo (y la carpeta en-construccion/).
  -->
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-display: swap; font-weight: 100 900;
      src: url('/en-construccion/inter-latin.woff2') format('woff2'); }

    :root {
      --texto: #1d1824; --suave: #5a5168; --tenue: #7d7390; --oscuro: #2b2433; --oscuro-2: #3d3448;
      --acento: #7a4cc2; --acento-suave: #f1e8fc; --borde: #e3d9f0;
      --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--texto);
      background: radial-gradient(ellipse 80% 60% at 50% 0%, #e6d6f8 0%, #f3ecfb 50%, #f9f6fd 100%) fixed, #f9f6fd;
      -webkit-font-smoothing: antialiased; line-height: 1.6;
      /* Una sola pantalla: cabecera, contenido centrado y pie */
      min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
    }
    a { color: inherit; }
    .contenedor { width: min(1080px, 100% - 40px); margin: 0 auto; }

    header { padding: calc(22px + var(--sat)) 0 0; }
    header .contenedor { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .marca { font-size: 1.35rem; font-weight: 800; letter-spacing: -.03em; text-decoration: none; }
    .marca b { color: var(--acento); font-weight: 800; }
    .nav-contacto { font-size: .9rem; font-weight: 600; color: var(--suave); text-decoration: none; padding: 8px 14px;
      border: 1px solid var(--borde); border-radius: 999px; background: rgba(255, 255, 255, .6); transition: border-color .15s, color .15s; }
    .nav-contacto:hover { color: var(--texto); border-color: #c9b6e4; }

    main { flex: 1; display: flex; align-items: center; padding: 24px 0; }
    .portada { width: 100%; text-align: center; }
    .estado { display: inline-flex; align-items: center; gap: 8px; font-size: .78rem; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--acento); padding: 6px 12px; border-radius: 999px;
      background: var(--acento-suave); border: 1px solid #ddc9f6; }
    .estado i { width: 7px; height: 7px; border-radius: 50%; background: var(--acento); box-shadow: 0 0 0 0 rgba(122, 76, 194, .5);
      animation: latido 2s ease-out infinite; }
    @keyframes latido { 70% { box-shadow: 0 0 0 8px rgba(122, 76, 194, 0); } 100% { box-shadow: 0 0 0 0 rgba(122, 76, 194, 0); } }
    h1 { margin: 22px auto 0; max-width: 16ch; font-size: clamp(2.3rem, 6.2vw, 4.4rem); line-height: 1.05; font-weight: 800; letter-spacing: -.04em; }
    h1 span { background: linear-gradient(90deg, #8a5cc9, var(--acento) 55%, #4b3470); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .entradilla { margin: 20px auto 0; max-width: 46ch; font-size: clamp(1.02rem, 1.6vw, 1.15rem); color: var(--suave); }

    /* Mientras, LunaPy */
    .mientras { margin: 36px auto 0; max-width: 460px; display: flex; align-items: center; gap: 16px; text-align: left;
      padding: 14px 14px 14px 18px; border-radius: 16px; background: rgba(255, 255, 255, .72); border: 1px solid var(--borde);
      box-shadow: 0 1px 2px rgba(43, 36, 51, .04), 0 8px 24px rgba(43, 36, 51, .05); }
    .mientras p { margin: 0; flex: 1; font-size: .92rem; color: var(--suave); line-height: 1.45; }
    .mientras strong { display: block; color: var(--texto); font-size: .98rem; }
    .boton { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 11px; font-weight: 700;
      font-size: .95rem; text-decoration: none; background: var(--oscuro); color: #fff; box-shadow: 0 6px 18px rgba(43, 36, 51, .2);
      transition: transform .15s ease, background .15s ease; }
    .boton:hover { background: var(--oscuro-2); transform: translateY(-1px); }
    .boton svg { transition: transform .15s ease; }
    .boton:hover svg { transform: translateX(3px); }
    .boton:focus-visible, .nav-contacto:focus-visible { outline: 3px solid var(--acento); outline-offset: 3px; }

    footer { padding: 0 0 calc(22px + var(--sab)); }
    footer .contenedor { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; font-size: .85rem; color: var(--tenue); }
    footer a { color: var(--suave); text-decoration: none; }
    footer a:hover { color: var(--texto); }

    .entra { opacity: 0; animation: entrar .7s cubic-bezier(.2, .7, .2, 1) forwards; }
    .d1 { animation-delay: .08s; } .d2 { animation-delay: .16s; } .d3 { animation-delay: .26s; }
    @keyframes entrar { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    @media (max-width: 480px) {
      .mientras { flex-direction: column; align-items: stretch; text-align: center; padding: 16px; gap: 12px; }
      .boton { justify-content: center; }
    }
    @media (max-height: 620px) {
      header { padding-top: calc(14px + var(--sat)); }
      main { padding: 12px 0; }
      h1 { margin-top: 14px; font-size: clamp(2rem, 8.5vw, 3.4rem); }
      .entradilla { margin-top: 12px; }
      .mientras { margin-top: 20px; }
      footer { padding-bottom: calc(14px + var(--sab)); }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .entra { opacity: 1; } }
  </style>
</head>
<body>
  <header>
    <div class="contenedor">
      <a class="marca" href="/" aria-label="lunadev, inicio">luna<b>dev</b></a>
      <a class="nav-contacto" href="mailto:info@lunadev.es">Contacto</a>
    </div>
  </header>

  <main class="contenedor">
    <section class="portada">
      <span class="estado entra"><i aria-hidden="true"></i> Web en construcción</span>
      <h1 class="entra d1">Estamos construyendo <span>grandes cosas</span>.</h1>
      <p class="entradilla entra d2">Nuestra nueva web llegará muy pronto. Vuelve en unos días para verla.</p>
      <div class="mientras entra d3">
        <p><strong>Mientras, aprende Python con LunaPy</strong>Lecciones, retos y una asistente que te guía paso a paso.</p>
        <a class="boton" href="/lunapy/">Ir a LunaPy
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
        </a>
      </div>
    </section>
  </main>

  <footer>
    <div class="contenedor">
      <span>© <span id="anio">2026</span> lunadev</span>
      <a href="mailto:info@lunadev.es">info@lunadev.es</a>
    </div>
  </footer>
  <script>document.getElementById('anio').textContent = new Date().getFullYear();</script>
</body>
</html>
